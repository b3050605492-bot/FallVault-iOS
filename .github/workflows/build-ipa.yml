name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (no code signing)
        run: |
          xcodebuild \
            -project FallVault.xcodeproj \
            -scheme FallVault \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FallVault.app Payload/
          # 未签名 IPA：里面的二进制没有签名，侧载工具（Sideloadly / AltStore）会用你自己的 Apple ID 重签
          zip -qry FallVault-unsigned.ipa Payload
          ls -lh FallVault-unsigned.ipa
          echo "--- app bundle 内容 ---"
          ls -la Payload/FallVault.app | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FallVault-unsigned-ipa
          path: FallVault-unsigned.ipa
          retention-days: 30
